<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Confirmação de envio do pedido de projeto — Waldênia Silva, Estúdio Criativo.">
<title>Pedido enviado — Waldênia Silva</title>
<link rel="stylesheet" href="./styles.css">
<style>
.thankyou-page{min-height:100vh;display:grid;place-items:center;padding:32px 6vw}
.thankyou-card{width:min(100%,720px);padding:clamp(28px,6vw,64px);border:1px solid rgba(0,0,0,.12);border-radius:18px}
.thankyou-card h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:1.03;letter-spacing:-.045em;margin:16px 0}
.thankyou-card p{line-height:1.75;max-width:56ch}
.thankyou-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.thankyou-actions a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.thankyou-secondary{padding:12px 18px;border:1px solid currentColor;border-radius:999px}
</style>
</head>
<body>
<main class="thankyou-page">
<section class="thankyou-card" aria-labelledby="thankyou-title">
<p class="eyebrow">ESTÚDIO CRIATIVO · WALDÊNIA SILVA</p>
<h1 id="thankyou-title" data-pt="Pedido enviado" data-en="Request submitted">Pedido enviado</h1>
<p data-pt="Obrigada por partilhares os detalhes do teu projeto. O pedido foi encaminhado para análise. Entrarei em contacto através do endereço de e-mail que indicaste." data-en="Thank you for sharing your project details. Your request has been forwarded for review. I will contact you using the email address you provided.">Obrigada por partilhares os detalhes do teu projeto. O pedido foi encaminhado para análise. Entrarei em contacto através do endereço de e-mail que indicaste.</p>
<div class="thankyou-actions">
<a class="button" href="./index.html" data-pt="Voltar à página inicial" data-en="Back to homepage">Voltar à página inicial</a>
<a class="thankyou-secondary" href="./index.html#contacto" data-pt="Voltar ao contacto" data-en="Back to contact">Voltar ao contacto</a>
</div>
</section>
</main>
<script>
(function(){if(localStorage.getItem("site-language")==="en"){document.documentElement.lang="en";document.querySelectorAll("[data-pt][data-en]").forEach(function(el){el.textContent=el.dataset.en;});}})();
</script>
</body>
</html>
